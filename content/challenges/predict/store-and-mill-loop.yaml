# Floor 1, Babbage's phase 2 (a retry): the Mill runs the same cards three times.
title: The Mill Repeats
difficulty: 2
topics: [variables, tracing, loops]
prompt: The Store holds v1, v2 and v3; the cards loop three times. What's in each column at the end? Type the exact output.
python: |
  v1 = 1
  v2 = 0
  for _ in range(3):
      v2 = v2 + v1
      v1 = v1 * 2
  v3 = v1 + v2
  print(v1, v2, v3)
javascript: |
  let v1 = 1
  let v2 = 0
  for (let n = 0; n < 3; n++) {
    v2 = v2 + v1
    v1 = v1 * 2
  }
  let v3 = v1 + v2
  console.log(v1, v2, v3)
